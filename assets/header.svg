<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Abel Rodríguez Torres — Ingeniero en Sistemas Computacionales, Backend .NET">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#130f22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#7c5cdb" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c5cdb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="880" height="250" fill="url(#fade)"/></mask>
    <clipPath id="clip"><rect width="880" height="250" rx="18"/></clipPath>
    <style>
      .ring { transform-origin: 700px 125px; animation: spin 60s linear infinite; }
      .ring2 { transform-origin: 700px 125px; animation: spin 90s linear infinite reverse; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="880" height="250" fill="url(#bg)"/>
    <rect width="880" height="250" fill="url(#dots)" mask="url(#m)"/>
    <rect width="880" height="250" fill="url(#glow)"/>

    <g fill="none" stroke="#a684ff">
      <circle cx="700" cy="125" r="62" stroke-opacity="0.35"/>
      <g class="ring"><circle cx="700" cy="125" r="92" stroke-opacity="0.25" stroke-dasharray="2 9"/>
        <circle cx="792" cy="125" r="3.5" fill="#a684ff" stroke="none"/></g>
      <g class="ring2"><circle cx="700" cy="125" r="124" stroke-opacity="0.14"/>
        <circle cx="700" cy="1" r="2.5" fill="#e6edf3" stroke="none" fill-opacity="0.8"/></g>
    </g>
    <circle cx="700" cy="125" r="6" fill="#a684ff" class="pulse"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="249" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="56" y="82" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" letter-spacing="2.4" fill="#a684ff">INGENIERO EN SISTEMAS COMPUTACIONALES</text>
  <text x="54" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="600" letter-spacing="-0.8" fill="#e6edf3">Abel Rodríguez Torres</text>
  <text x="56" y="170" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8b949e">Backend .NET · Nómina y RR. HH. · Bases de datos</text>
  <circle cx="61" cy="203" r="3.5" fill="#3fb950"/>
  <text x="73" y="207.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8b949e">República Dominicana</text>
</svg>
