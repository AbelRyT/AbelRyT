name: Generar gráfica de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza cada 12 horas
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribuciones.svg?color_snake=#8A63D2&color_dots=#ebedf0,#d8ccf2,#b49ae6,#8a63d2,#5a3f99
            dist/contribuciones-dark.svg?palette=github-dark&color_snake=#a684ff&color_dots=#161b22,#2e2350,#4b3a85,#6f52bf,#a684ff

      - name: Publicar en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
